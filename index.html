<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="title">
            <h1>Rock Paper Scissors Game</h1>
        </div>
        <div id="images">
            <div class="choices" id="rock">
                <img src="images/rock.png" alt="Rock img">
            </div>
            <div class="choices" id="paper">
                <img src="images/paper.png" alt="Paper img">
            </div>
            <div class="choices" id="scissors">
                <img src="images/scissors.png" alt="Scissors img">
            </div>
        </div>
        <div id="score">
            <div class="numbers">
                <span id="user-score">0</span>
                <h3>You</h3>
            </div>
            <div class="numbers">
                <span id="comp-score">0</span>
                <h3>Comp</h3>
            </div>
        </div>
        <div id="showWinner">
            <h2>Pick Your Move</h2>
        </div>
    </main> 
</body>
    <script src="script.js"></script>
</html>
